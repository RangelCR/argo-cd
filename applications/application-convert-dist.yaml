apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-convet-dist
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true  
spec:
  project: default

  source:
    repoURL: https://github.com/RangelCR/conversao-distancia.git
    targetRevision: main
    path: k8s/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
