apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cotacao-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RangelCR/cotacao-web.git
    path: k8s/
    targetRevision: HEAD
    directory:
      include: '{deploy.yaml,service.yaml,namespace.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: cotacao-web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
