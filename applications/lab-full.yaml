apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-full
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RangelCR/argo-cd.git
    targetRevision: HEAD
    path: lab-argocd-sync/full
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true